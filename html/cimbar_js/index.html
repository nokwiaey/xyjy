<!doctype html>
<html lang="zh-CN" data-framework="javascript">

<head>
  <title>隔空传输 · Cimbar 编码器</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, user-scalable=no">
  <link rel="manifest" href="pwa.json">
</head>

<body>

  <style>
    * {
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100vh;
    }

    body {
      background-color: white;
      background-image: linear-gradient(135deg, rgb(0, 0, 0) 65px, transparent 130px),
        repeating-linear-gradient(135deg, rgb(0, 0, 0) 0px, rgb(153, 197, 206) 1px, transparent 1px, transparent 30px),
        repeating-linear-gradient(45deg, rgb(0, 0, 0) 0px, rgb(153, 197, 206) 1px, transparent 1px, transparent 30px);
      background-size: cover;
      color: gray;
      display: grid;
      align-items: center;
      transition: opacity 0.4s ease-in;
    }

    #status {
      position: fixed;
      right: 0;
      top: 0;
    }

    #nav-container {
      z-index: 1;
    }

    #nav-content,
    #nav-container .bg,
    #nav-container:focus-within,
    #nav-container:focus-within #nav-button {
      z-index: 1;
    }

    /* canvas/dragdrop */
    #canvas {
      display: block;
      position: relative;
      z-index: 2;
      pointer-events: none;
    }

    #dragdrop {
      background-color: #3C3D82;
      background-image: linear-gradient(135deg, rgba(249, 249, 249, 0.1) 0%, rgba(249, 249, 249, 0.1) 18%, rgba(70, 70, 70, 0.1) 18%, rgba(70, 70, 70, 0.1) 33%, rgba(229, 229, 229, 0.1) 33%, rgba(229, 229, 229, 0.1) 35%, rgba(53, 53, 53, 0.1) 35%, rgba(53, 53, 53, 0.1) 47%, rgba(156, 156, 156, 0.1) 47%, rgba(156, 156, 156, 0.1) 100%), linear-gradient(135deg, rgba(106, 106, 106, 0.08) 0%, rgba(106, 106, 106, 0.08) 9%, rgba(123, 123, 123, 0.08) 9%, rgba(123, 123, 123, 0.08) 10%, rgba(69, 69, 69, 0.08) 10%, rgba(69, 69, 69, 0.08) 38%, rgba(33, 33, 33, 0.08) 38%, rgba(33, 33, 33, 0.08) 65%, rgba(24, 24, 24, 0.08) 65%, rgba(24, 24, 24, 0.08) 77%, rgba(210, 210, 210, 0.08) 77%, rgba(210, 210, 210, 0.08) 100%), linear-gradient(45deg, rgba(70, 70, 70, 0.02) 0%, rgba(70, 70, 70, 0.02) 23%, rgba(225, 225, 225, 0.02) 23%, rgba(225, 225, 225, 0.02) 29%, rgba(118, 118, 118, 0.02) 29%, rgba(118, 118, 118, 0.02) 36%, rgba(28, 28, 28, 0.02) 36%, rgba(28, 28, 28, 0.02) 42%, rgba(142, 142, 142, 0.02) 42%, rgba(142, 142, 142, 0.02) 85%, rgba(95, 95, 95, 0.02) 85%, rgba(95, 95, 95, 0.02) 93%, rgba(32, 32, 32, 0.02) 93%, rgba(32, 32, 32, 0.02) 98%, rgba(71, 71, 71, 0.02) 98%, rgba(71, 71, 71, 0.02) 100%), linear-gradient(135deg, rgba(207, 207, 207, 0.05) 0%, rgba(207, 207, 207, 0.05) 12%, rgba(32, 32, 32, 0.05) 12%, rgba(32, 32, 32, 0.05) 27%, rgba(79, 79, 79, 0.05) 27%, rgba(79, 79, 79, 0.05) 32%, rgba(139, 139, 139, 0.05) 32%, rgba(139, 139, 139, 0.05) 43%, rgba(150, 150, 150, 0.05) 43%, rgba(150, 150, 150, 0.05) 79%, rgba(139, 139, 139, 0.05) 79%, rgba(139, 139, 139, 0.05) 87%, rgba(55, 55, 55, 0.05) 87%, rgba(55, 55, 55, 0.05) 91%, rgba(68, 68, 68, 0.05) 91%, rgba(68, 68, 68, 0.05) 100%), linear-gradient(0deg, rgba(108, 108, 108, 0.1) 0%, rgba(108, 108, 108, 0.1) 16%, rgba(163, 163, 163, 0.1) 16%, rgba(163, 163, 163, 0.1) 18%, rgba(32, 32, 32, 0.1) 18%, rgba(32, 32, 32, 0.1) 29%, rgba(122, 122, 122, 0.1) 29%, rgba(122, 122, 122, 0.1) 61%, rgba(141, 141, 141, 0.1) 61%, rgba(141, 141, 141, 0.1) 67%, rgba(53, 53, 53, 0.1) 67%, rgba(53, 53, 53, 0.1) 78%, rgba(142, 142, 142, 0.1) 78%, rgba(142, 142, 142, 0.1) 100%), linear-gradient(0deg, rgba(160, 160, 160, 0.08) 0%, rgba(160, 160, 160, 0.08) 27%, rgba(163, 163, 163, 0.08) 27%, rgba(163, 163, 163, 0.08) 29%, rgba(37, 37, 37, 0.08) 29%, rgba(37, 37, 37, 0.08) 35%, rgba(96, 96, 96, 0.08) 35%, rgba(96, 96, 96, 0.08) 73%, rgba(250, 250, 250, 0.08) 73%, rgba(250, 250, 250, 0.08) 90%, rgba(91, 91, 91, 0.08) 90%, rgba(91, 91, 91, 0.08) 100%), linear-gradient(90deg, rgba(191, 191, 191, 0.08) 0%, rgba(191, 191, 191, 0.08) 2%, rgba(170, 170, 170, 0.08) 2%, rgba(170, 170, 170, 0.08) 7%, rgba(49, 49, 49, 0.08) 7%, rgba(49, 49, 49, 0.08) 9%, rgba(131, 131, 131, 0.08) 9%, rgba(131, 131, 131, 0.08) 23%, rgba(197, 197, 197, 0.08) 23%, rgba(197, 197, 197, 0.08) 29%, rgba(154, 154, 154, 0.08) 29%, rgba(154, 154, 154, 0.08) 91%, rgba(211, 211, 211, 0.08) 91%, rgba(211, 211, 211, 0.08) 100%), linear-gradient(90deg, rgb(0, 119, 100), rgb(0, 0, 119));
      margin: 0 auto;
      color: #F0F0F0;
      outline: 6px solid black;
      box-shadow: 0px 0px 12px black, 0px 0px 18px black;
      position: relative;
      cursor: pointer;
      z-index: 0;
    }

    #dragdrop.active,
    #dragdrop.active * {
      cursor: none !important;
    }

    .drop-message {
      position: absolute;
      inset: 0;
      z-index: 1;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 3em;
      padding-bottom: 2em;
      text-align: center;

      pointer-events: none;
    }

    .drop-message p {
      font: 1.2em serif;
      margin: 0;
      padding-bottom: 1em;
    }

    .drop-message p:first-of-type {
      font: 1.5em serif;
    }

    .drop-message .msg-long {
      font: 0.9em serif;
    }

    .drop-message .msg-bottom {
      margin-top: auto;
    }

    .drop-message .msg-error {
      display: none;
    }

    .dragdrop.error .drop-message .msg-default {
      display: none;
    }

    .dragdrop.error .drop-message .msg-error {
      display: block;
    }

    /* options */
    #nav-container a.mode-b,
    #nav-container a.mode-bm,
    #nav-container a.mode-bu,
    #nav-container a.mode-4c {
      color: #555;
    }

    #nav-container.mode-b a.mode-b,
    #nav-container.mode-bm a.mode-bm,
    #nav-container.mode-bu a.mode-bu,
    #nav-container.mode-4c a.mode-4c {
      color: #9fa6b2;
    }

    /* nav stuff */
    /* built off of https://codepen.io/dannievinther/pen/NvZjvz */
    #nav-container {
      position: fixed;
      top: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    #nav-container .bg {
      pointer-events: auto;
      position: absolute;
      left: 0;
      width: 100%;
      height: 100%;
      visibility: hidden;
      opacity: 0;
      transition: .3s;
      background: black;
    }

    #nav-container:focus-within .bg {
      visibility: visible;
      opacity: .6;
    }

    #nav-container * {
      visibility: visible;
    }

    #nav-button {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      height: 60px;
      width: 30px;
      margin-left: 15px;
      cursor: pointer;
      pointer-events: auto;
      touch-action: manipulation;
      border: 0;
      outline: 0;
      background-image: linear-gradient(180deg, rgb(0, 0, 0, 0) 10%, rgb(0, 0, 0) 40%, rgb(0, 0, 0) 60%, rgb(0, 0, 0, 0) 90%);
      background-color: initial;
    }

    #nav-button.hide {
      opacity: 0;
      transition: .3s;
    }

    #nav-container:focus-within #nav-button.hide {
      opacity: 1;
    }

    .icon-bar {
      display: block;
      width: 100%;
      height: 3px;
      transition: .3s;
    }

    .icon-bar+.icon-bar {
      margin-top: 3px;
    }

    #nav-container .icon-bar:nth-of-type(1) {
      background-color: #00ff00;
      box-shadow: 0px 0px 5px #00ff00, 0px 0px 2px #00ff00;
    }

    #nav-container .icon-bar:nth-of-type(2) {
      background-color: #ffff00;
      box-shadow: 0px 0px 5px #ffff00, 0px 0px 2px #ffff00;
    }

    #nav-container .icon-bar:nth-of-type(3) {
      background-color: #00ffff;
      box-shadow: 0px 0px 5px #00ffff, 0px 0px 2px #00ffff;
    }

    #nav-container .icon-bar:nth-of-type(4) {
      background-color: #ff00ff;
      box-shadow: 0px 0px 5px #ff00ff, 0px 0px 2px #ff00ff;
    }

    #nav-container.mode-4c .icon-bar:nth-of-type(1) {
      background-color: #00ffff;
      box-shadow: 0px 0px 5px #00ffff, 0px 0px 2px #00ffff;
    }

    #nav-container.mode-4c .icon-bar:nth-of-type(2) {
      background-color: #ffff00;
      box-shadow: 0px 0px 5px #ffff00, 0px 0px 2px #ffff00;
    }

    #nav-container.mode-4c .icon-bar:nth-of-type(3) {
      background-color: #00ff00;
      box-shadow: 0px 0px 5px #00ff00, 0px 0px 2px #00ff00;
    }

    #nav-container.mode-4c .icon-bar:nth-of-type(4) {
      background-color: #ff00ff;
      box-shadow: 0px 0px 5px #ff00ff, 0px 0px 2px #ff00ff;
    }

    #nav-container:focus-within #nav-button {
      pointer-events: none;
    }

    #nav-container:focus-within .icon-bar {
      background-color: #aaa;
      background-image: none !important;
      box-shadow: none !important;
    }

    #nav-button.attention:focus-within .icon-bar {
      background-color: #00ffff;
    }

    #nav-container:focus-within .icon-bar:nth-of-type(1) {
      transform: translate3d(0, 9px, 0) rotate(45deg);
    }

    #nav-container:focus-within .icon-bar:nth-of-type(2),
    #nav-container:focus-within .icon-bar:nth-of-type(3) {
      opacity: 0;
    }

    #nav-container:focus-within .icon-bar:nth-of-type(4) {
      transform: translate3d(0, -9px, 0) rotate(-45deg);
    }

    #nav-content {
      margin-top: 60px;
      padding: 20px;
      position: absolute;
      top: 0;
      left: 0;
      height: calc(100% - 60px);
      overflow-x: clip;
      background-color: #282C34;
      text-align: center;
      pointer-events: auto;
      -webkit-tap-highlight-color: rgba(0, 0, 0, 0);
      transform: translateX(-100%);
      transition: transform .3s;
    }

    #nav-content ul {
      height: calc(100% - 60px);
      display: flex;
      flex-direction: column;
      list-style: none;
    }

    #nav-content hr {
      border: 1px solid #444;
    }

    #nav-content li a {
      display: block;
      padding: 10px 5px;
      color: #9fa6b2;
      text-decoration: none;
      transition: color .1s;
    }

    #nav-content li a.attention {
      animation: glowing 1.5s infinite alternate;
    }

    #nav-content li a {
      font-variant: small-caps;
      font-size: 2em;
    }

    #nav-content h4 {
      font-variant: small-caps;
      padding-top: 1em;
    }

    #nav-content li.modesel a {
      display: inline-block;
      width: 2em;
    }

    #nav-content li:hover {
      background-color: #2c323c;
    }

    #nav-content li:not(.small)+.small {
      margin-top: auto;
    }

    #nav-content li.small {
      display: flex;
      align-self: center;
    }

    #nav-content li.small a {
      font-size: 1em;
    }

    #nav-content li .range {
      margin-top: 0.6em;
      width: 100%;
    }

    #nav-container:focus-within #nav-content {
      transform: none;
    }

    @keyframes glowing {
      0% {
        color: #00ffff;
      }
    }

    /* 语言开关：刻意保持朴素，不改动其它界面 */
    #lang-switch {
      position: fixed;
      top: 0;
      right: 0;
      z-index: 3;
      pointer-events: auto;
      -webkit-tap-highlight-color: rgba(0, 0, 0, 0);
    }

    #lang-switch button {
      font: 13px/1 sans-serif;
      padding: 5px 9px;
      border: 0;
      background-color: rgba(0, 0, 0, 0.55);
      color: #d0d0d0;
      cursor: pointer;
    }

    #lang-switch button+button {
      margin-left: 2px;
    }

    #lang-switch button[aria-pressed="true"] {
      background-color: #3C3D82;
      color: #ffffff;
      font-weight: bold;
    }
  </style>

  <div id="status"></div>
  <div id="lang-switch" role="group" aria-label="语言 / Language">
    <button type="button" id="lang-zh" data-lang="zh" aria-pressed="true" onclick="Lang.setLang('zh')">简体中文</button>
    <button type="button" id="lang-en" data-lang="en" aria-pressed="false" onclick="Lang.setLang('en')">English</button>
  </div>

  <div id="dragdrop" class="dragdrop" title="拖入文件即可开始传输" data-i18n-title="dropTitle" onclick="Main.clickNav()">
    <div class="drop-message">
      <p class="msg-default" data-i18n="tap">⌜ 点击开始 ⌟</p>
      <p class="msg-error" data-i18n="glError">⌜ 出错了：当前浏览器未启用 WebGL :( ⌟</p>
      <p class="msg-default msg-bottom" data-i18n="warnTitle">⚠️⚡ 光敏性癫痫警告！</p>
      <p class="msg-default msg-long" data-i18n="warnBody">闪烁的画面可能诱发光敏性癫痫发作，请务必注意安全。</p>
      <p class="msg-default msg-long" data-i18n="warnFoot">请保持安全距离，祝使用愉快！⚠️⚡</p>
    </div>
    <canvas id="canvas" class="canvas"></canvas>
  </div>

  <input style="display:none;" type="file" name="file_input" id="file_input" onchange="Main.fileInput(this);" />

  <div id="nav-container" class="mode-b">
    <div class="bg" onpointerdown="Main.blurNav(); event.preventDefault();"></div>
    <button id="nav-button" tabindex="0" onclick="Main.clickNav();">
      <span class="icon-bar"></span>
      <span class="icon-bar"></span>
      <span class="icon-bar"></span>
      <span class="icon-bar"></span>
    </button>
    <div id="nav-content" tabindex="-1">
      <span id="current-file" data-i18n="noFile">未选择文件</span>
      <ul>
        <li><a class="attention" id="nav-find-file-link" href="javascript:void(0)" onclick="Main.clickFileInput()"
            data-i18n="findFile">选择文件</a></li>
        <hr>
        <li class="modesel">
          <h4 data-i18n="mode">模式</h4>
          <a class="mode-b" href="javascript:void(0)" onclick="Main.setMode('B')">B</a>
          <a class="mode-bm" href="javascript:void(0)" onclick="Main.setMode('Bm')">Bm</a>
          <a class="mode-bu" href="javascript:void(0)" onclick="Main.setMode('Bu')">Bu</a>
          <a class="mode-4c" href="javascript:void(0)" onclick="Main.setMode('4C')">4C</a>
        </li>
        <li>
          <h4 data-i18n="framerate">帧率</h4>
          <input type="range" class="range" min="5" max="20" step="5" value="15" oninput="Main.setFPS(this.value)"
            onchange="Main.setFPS(this.value)" />
        </li>
        <li class="small"><a href="javascript:void(0)" onclick="Main.toggleFullscreen()" data-i18n="fullscreen">全屏</a></li>
        <li class="small"><a href="https://github.com/sz3/libcimbar" data-i18n="github">github</a></li>
        <li class="small"><a href="https://github.com/sz3/cfc/releases/latest" data-i18n="androidApp">安卓 App</a></li>
      </ul>
    </div>
  </div>

  <script type="text/javascript">
    // 界面语言：默认简体中文，可在右上角切换，选择会记住（localStorage）
    var Lang = function () {
      var STORAGE_KEY = 'cimbar-lang';
      var DEFAULT_LANG = 'zh';

      var STRINGS = {
        zh: {
          docTitle: '隔空传输 · Cimbar 编码器',
          tap: '⌜ 点击开始 ⌟',
          glError: '⌜ 出错了：当前浏览器未启用 WebGL :( ⌟',
          warnTitle: '⚠️⚡ 光敏性癫痫警告！',
          warnBody: '闪烁的画面可能诱发光敏性癫痫发作，请务必注意安全。',
          warnFoot: '请保持安全距离，祝使用愉快！⚠️⚡',
          dropTitle: '拖入文件即可开始传输',
          noFile: '未选择文件',
          findFile: '选择文件',
          mode: '模式',
          framerate: '帧率',
          fullscreen: '全屏',
          github: 'github',
          androidApp: '安卓 App'
        },
        en: {
          docTitle: 'Cimbar Encoder',
          tap: '⌜ Tap to start! ⌟',
          glError: '⌜ Error! WebGL is not enabled :( ⌟',
          warnTitle: '⚠️⚡ PHOTOSENSITIVITY WARNING!',
          warnBody: 'Photosensitive epilepsy + flickering light = seizure!',
          warnFoot: 'Be safe! Have fun! ⚠️⚡',
          dropTitle: 'Drag and drop a file',
          noFile: 'No file selected',
          findFile: 'Find File',
          mode: 'Mode',
          framerate: 'Framerate',
          fullscreen: 'Fullscreen',
          github: 'github',
          androidApp: 'android app'
        }
      };

      var _lang = DEFAULT_LANG;
      var _file = '';

      function t(key) {
        var table = STRINGS[_lang] || STRINGS[DEFAULT_LANG];
        var val = table[key];
        return val === undefined ? key : val;
      }

      function apply() {
        document.documentElement.lang = _lang === 'zh' ? 'zh-CN' : 'en';

        var nodes = document.querySelectorAll('[data-i18n]');
        for (var i = 0; i < nodes.length; i++) {
          // #current-file 由编码器填入文件名，没选文件时显示占位文案
          if (nodes[i].id === 'current-file' && _file) {
            nodes[i].textContent = _file;
          } else {
            nodes[i].textContent = t(nodes[i].getAttribute('data-i18n'));
          }
        }

        var titled = document.querySelectorAll('[data-i18n-title]');
        for (var j = 0; j < titled.length; j++) {
          titled[j].setAttribute('title', t(titled[j].getAttribute('data-i18n-title')));
        }

        var buttons = document.querySelectorAll('#lang-switch button');
        for (var k = 0; k < buttons.length; k++) {
          buttons[k].setAttribute('aria-pressed', buttons[k].getAttribute('data-lang') === _lang ? 'true' : 'false');
        }

        document.title = t('docTitle') + (_file ? ' · ' + _file : '');
      }

      function setLang(next) {
        _lang = next === 'en' ? 'en' : 'zh';
        try {
          localStorage.setItem(STORAGE_KEY, _lang);
        } catch (e) { /* 隐私模式：忽略即可 */ }
        apply();
      }

      // 读取上次选择的语言（首次访问默认简体中文）
      try {
        var saved = localStorage.getItem(STORAGE_KEY);
        if (saved === 'en' || saved === 'zh') {
          _lang = saved;
        }
      } catch (e) { /* ignore */ }

      apply();

      // 供页面内联 onclick 与 main.js 使用
      window.Lang = {
        t: t,
        current: function () { return _lang; },
        setLang: setLang,
        apply: apply,
        setFile: function (name) { _file = name || ''; apply(); },
        clearFile: function () { _file = ''; apply(); }
      };

      return window.Lang;
    }();
  </script>
  <script src="send.js"></script>
  <script src="main.js"></script>

  <script type="text/javascript">
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }

    var canvas = document.getElementById('canvas');
    if (!Main.init_ww(canvas)) {
      var Module = {};
      Module.canvas = canvas;
      Module.onRuntimeInitialized = () => {
        Main.init(canvas);
      };
    }
  </script>

  <script type="text/javascript">
    Main.check_GL_enabled();
  </script>
  <script src="cimbar_js.js"></script>

</body>

</html>
