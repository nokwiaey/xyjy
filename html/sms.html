<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一键发送短信</title>

<style>
body {
    font-family: "Microsoft YaHei", Arial, sans-serif;
    background:#f5f5f5;
    padding:30px 20px;
}

.container {
    max-width:500px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:10px;
}

h3 {
    text-align:center;
}

input,
textarea {
    width:100%;
    box-sizing:border-box;
    margin-top:10px;
    padding:10px;
    border:1px solid #ddd;
    border-radius:5px;
    font-size:15px;
}

textarea {
    height:120px;
}

button {
    width:100%;
    height:45px;
    margin-top:15px;
    border:0;
    border-radius:6px;
    background:#1677ff;
    color:white;
    font-size:16px;
}

.info {
    margin-top:15px;
    color:#666;
    line-height:1.8;
}

.url-box {
    margin-top:15px;
    padding:10px;
    background:#f6f6f6;
    word-break:break-all;
    font-size:14px;
}

.qrcode {
    margin-top:20px;
    text-align:center;
}

.qrcode img {
    width:200px;
    height:200px;
}

.tip {
    margin-top:10px;
    color:#999;
    font-size:13px;
}

.hidden {
    display:none;
}

</style>

</head>


<body>

<div class="container">

<h3>一键发送短信</h3>


<label>
手机号码
</label>

<input
id="phoneInput"
type="tel"
placeholder="请输入手机号码">



<label>
短信内容
</label>

<textarea
id="textInput"
placeholder="请输入短信内容"></textarea>



<button id="sendBtn">
发送短信
</button>


<button id="createBtn">
生成分享链接
</button>



<div id="result" class="url-box hidden"></div>



<div id="qrcode" class="qrcode hidden"></div>



<button id="copyBtn" class="hidden">
复制链接
</button>



<div class="info">

说明：
<br>
1. 可通过 URL 参数自动填充手机号和短信内容。
<br>
2. 参数格式：
<br>
?phone=手机号&text=短信内容
<br>
3. 点击发送短信将在手机短信 APP 中打开。
<br>
4. 修改内容后需要重新生成二维码。

</div>


</div>


<script>


function getParam(name){

    return new URLSearchParams(
        window.location.search
    ).get(name) || "";

}



const phoneInput =
document.getElementById("phoneInput");


const textInput =
document.getElementById("textInput");



// 自动读取参数

phoneInput.value =
getParam("phone");


textInput.value =
getParam("text");





// 当前页面生成 URL

function createUrl(){


    let phone =
    phoneInput.value.trim();


    let text =
    textInput.value.trim();



    return location.origin +
    location.pathname +
    "?phone=" +
    encodeURIComponent(phone) +
    "&text=" +
    encodeURIComponent(text);

}





// 发送短信

document.getElementById("sendBtn")
.onclick=function(){


    let phone =
    phoneInput.value.trim();


    let text =
    textInput.value.trim();



    if(!phone || !text){

        alert("请输入手机号和短信内容");

        return;

    }



    let body =
    encodeURIComponent(text);



    let ua =
    navigator.userAgent.toLowerCase();



    let url;



    if(/iphone|ipad|ipod/.test(ua)){


        url =
        "sms:" +
        phone +
        "&body=" +
        body;


    }else{


        url =
        "sms:" +
        phone +
        "?body=" +
        body;


    }



    location.href=url;


};






// 生成链接和二维码

document.getElementById("createBtn")
.onclick=function(){


    let phone =
    phoneInput.value.trim();


    let text =
    textInput.value.trim();



    if(!phone || !text){

        alert("请输入手机号和短信内容");

        return;

    }



    let url=createUrl();



    let result =
    document.getElementById("result");


    result.innerText=url;

    result.classList.remove("hidden");




    //二维码

    let qr =
    document.getElementById("qrcode");


    let img =
    new Image();


    img.width=200;

    img.height=200;



    img.onload=function(){


        qr.innerHTML="";


        qr.appendChild(img);


        let tip =
        document.createElement("div");


        tip.className="tip";

        tip.innerText="扫码打开短信页面";


        qr.appendChild(tip);


        qr.classList.remove("hidden");


    };



    img.onerror=function(){


        qr.innerHTML="";


        qr.classList.add("hidden");


    };



    img.src =
    "https://api.2dcode.biz/v1/create-qr-code?data="
    + encodeURIComponent(url);





    document.getElementById("copyBtn")
    .classList.remove("hidden");


};






//复制

document.getElementById("copyBtn")
.onclick=function(){


    let url =
    document.getElementById("result")
    .innerText;


    navigator.clipboard.writeText(url)
    .then(function(){

        alert("已复制");

    });


};


</script>


</body>

</html>
