<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一键短信</title>

<style>
body {
    font-family: "Microsoft YaHei", Arial, sans-serif;
    background: #f5f5f5;
    padding: 30px 20px;
}

.container {
    max-width: 500px;
    margin: auto;
    background: white;
    padding: 25px;
    border-radius: 10px;
}

button {
    width: 100%;
    height: 45px;
    margin-top: 15px;
    border: none;
    border-radius: 6px;
    background: #1677ff;
    color: white;
    font-size: 16px;
}

input,
textarea {
    width: 100%;
    box-sizing: border-box;
    padding: 10px;
    margin-top: 10px;
    border: 1px solid #ddd;
    border-radius: 5px;
    font-size: 15px;
}

textarea {
    height: 120px;
    resize: vertical;
}

.info {
    margin-top: 20px;
    line-height: 1.8;
    color: #666;
}

.url-box {
    margin-top: 15px;
    word-break: break-all;
    background: #f6f6f6;
    padding: 10px;
    border-radius: 5px;
    font-size: 14px;
}

.hidden {
    display:none;
}

.error {
    color:red;
}
</style>

</head>

<body>

<div class="container">

<h3>一键发送短信</h3>


<div id="sendArea" class="hidden">

<button id="sendBtn">
发送短信
</button>

<div class="info" id="smsInfo"></div>

</div>



<div id="createArea" class="hidden">

<label>
手机号码
</label>

<input 
id="phoneInput"
type="tel"
placeholder="请输入手机号码">


<label>
短信内容
</label>

<textarea
id="textInput"
placeholder="请输入短信内容"></textarea>


<button id="createBtn">
生成分享链接
</button>


<div id="result" class="url-box hidden"></div>


<button id="copyBtn" class="hidden">
复制链接
</button>


</div>


</div>


<script>

function getParam(name){

    return new URLSearchParams(
        window.location.search
    ).get(name) || "";

}


const phone = getParam("phone");
const text = getParam("text");


const sendArea =
    document.getElementById("sendArea");

const createArea =
    document.getElementById("createArea");


const smsInfo =
    document.getElementById("smsInfo");



/*
 有参数模式
*/

if(phone && text){

    sendArea.classList.remove("hidden");

    smsInfo.innerHTML =
        "号码：" + phone +
        "<br>内容：" + text;


    document.getElementById("sendBtn")
    .onclick=function(){

        let body =
            encodeURIComponent(text);


        let ua =
            navigator.userAgent.toLowerCase();


        let url;


        if(/iphone|ipad|ipod/.test(ua)){

            url =
            "sms:" + phone +
            "&body=" + body;

        }else{

            url =
            "sms:" + phone +
            "?body=" + body;

        }


        window.location.href=url;

    };


}


/*
 无参数模式
*/

else{


    createArea.classList.remove("hidden");


    document.getElementById("createBtn")
    .onclick=function(){


        let p =
        document.getElementById("phoneInput")
        .value.trim();


        let t =
        document.getElementById("textInput")
        .value.trim();


        if(!p || !t){

            alert("请输入手机号和短信内容");
            return;

        }


        let url =
            location.origin +
            location.pathname +
            "?phone=" +
            encodeURIComponent(p) +
            "&text=" +
            encodeURIComponent(t);



        let result =
        document.getElementById("result");


        result.innerText=url;

        result.classList.remove("hidden");


        document.getElementById("copyBtn")
        .classList.remove("hidden");


    };


    document.getElementById("copyBtn")
    .onclick=function(){

        let text =
        document.getElementById("result")
        .innerText;


        navigator.clipboard.writeText(text)
        .then(()=>{

            alert("已复制");

        });


    };


}



</script>

</body>
</html>
