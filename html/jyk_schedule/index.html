<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>检验科排班表 - 星元检验工具箱</title>
<meta name="description" content="榆林市星元医院临床检验中心排班表在线查看与下载，含各月份及节假日排班。">
<meta property="og:title" content="检验科排班表" />
<meta property="og:description" content="榆林市星元医院临床检验中心排班表在线查看与下载" />
<meta property="og:type" content="website" />
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
        --brand: #159895;
        --brand-dark: #1a5f7a;
        --bg: #f1f5f7;
        --card: #ffffff;
        --text: #1f3b45;
        --text-light: #6b8089;
        --border: #e2e9ec;
        --item: #eef4f6;
        --item-hover: #e0edf0;
        --shadow: 0 6px 18px rgba(21, 95, 122, 0.10);
        --sidebar-w: 216px;
    }

    @media (prefers-color-scheme: dark) {
        :root {
            --bg: #0f1a1f;
            --card: #16262c;
            --text: #e6eef1;
            --text-light: #93a8b0;
            --border: #24363d;
            --item: #1d323a;
            --item-hover: #264049;
            --shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
        }
    }

    html, body { height: 100%; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        display: grid;
        grid-template-columns: var(--sidebar-w) minmax(0, 1fr);
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
    }

    /* ---------------- 左侧竖排导航 ---------------- */
    .sidebar {
        display: flex;
        flex-direction: column;
        min-height: 0;
        background: var(--card);
        border-right: 1px solid var(--border);
    }

    .side-head {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 12px 10px;
        border-bottom: 1px solid var(--border);
    }
    .side-head .title {
        font-size: 0.92rem;
        font-weight: 700;
        color: var(--brand-dark);
        letter-spacing: 0.5px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    @media (prefers-color-scheme: dark) {
        .side-head .title { color: #7fd6d2; }
    }

    /* 列表项右侧的「打开」提示：仅移动端显示 */
    .open-hint {
        display: none;
        flex: 0 0 auto;
        font-size: 0.72rem;
        color: var(--brand);
        font-weight: 600;
    }

    .side-list {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 8px;
        scrollbar-width: thin;
    }
    .side-list::-webkit-scrollbar { width: 7px; }
    .side-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .year-head {
        font-size: 0.72rem;
        font-weight: 600;
        letter-spacing: 1px;
        color: var(--text-light);
        padding: 10px 8px 6px;
    }

    .item {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        margin-bottom: 4px;
        border: 1px solid transparent;
        border-radius: 9px;
        background: var(--item);
        color: var(--text);
        font-family: inherit;
        font-size: 0.86rem;
        text-align: left;
        cursor: pointer;
        transition: background 0.15s, color 0.15s;
    }
    .item:hover:not(.missing) { background: var(--item-hover); }
    .item.active {
        background: linear-gradient(135deg, var(--brand-dark), var(--brand));
        color: #fff;
        box-shadow: 0 3px 10px rgba(21, 152, 149, 0.30);
    }
    .item.missing {
        opacity: 0.42;
        cursor: not-allowed;
        background: transparent;
        border-color: var(--border);
        border-style: dashed;
    }
    .item .ico { font-size: 0.9rem; flex: 0 0 auto; }
    .item .txt { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    /* 移动端整条是链接 */
    .item > a.txt {
        display: flex;
        align-items: center;
        gap: 8px;
        flex: 1;
        min-width: 0;
        color: inherit;
        text-decoration: none;
    }
    .item > a.txt .label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .item .none { font-size: 0.7rem; color: var(--text-light); flex: 0 0 auto; }
    .item.active .none { color: rgba(255, 255, 255, 0.75); }

    .side-note {
        padding: 9px 12px;
        border-top: 1px solid var(--border);
        font-size: 0.72rem;
        color: var(--text-light);
        line-height: 1.5;
    }
    .side-note a { color: var(--brand); text-decoration: none; }
    .side-note a:hover { text-decoration: underline; }

    .state {
        margin: 6px;
        padding: 14px 12px;
        border: 1px dashed var(--border);
        border-radius: 10px;
        font-size: 0.8rem;
        color: var(--text-light);
        line-height: 1.7;
    }
    .state b { color: var(--text); display: block; margin-bottom: 4px; }
    .state code {
        display: inline-block;
        background: var(--item);
        border-radius: 4px;
        padding: 1px 5px;
        font-size: 0.74rem;
        word-break: break-all;
    }
    .state .retry {
        margin-top: 8px;
        border: 1px solid var(--border);
        background: var(--item);
        color: var(--text);
        border-radius: 8px;
        padding: 5px 12px;
        font-size: 0.78rem;
        font-family: inherit;
        cursor: pointer;
    }

    /* ---------------- 右侧预览 ---------------- */
    .viewer {
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
        background: var(--card);
    }

    .v-bar {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 14px;
        border-bottom: 1px solid var(--border);
        flex: 0 0 auto;
    }
    .v-title {
        flex: 1;
        min-width: 0;
        font-size: 0.9rem;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .v-actions { display: flex; gap: 8px; flex: 0 0 auto; }

    .btn {
        display: inline-flex;
        align-items: center;
        border: 1px solid var(--border);
        background: var(--item);
        color: var(--text);
        border-radius: 8px;
        padding: 6px 11px;
        font-size: 0.78rem;
        text-decoration: none;
        cursor: pointer;
        white-space: nowrap;
        transition: background 0.15s;
    }
    .btn:hover { background: var(--item-hover); }
    .btn.primary {
        background: linear-gradient(135deg, var(--brand-dark), var(--brand));
        color: #fff;
        border-color: transparent;
    }

    .frame-wrap {
        flex: 1;
        min-height: 0;
        position: relative;
        background: #525659;
    }
    .frame-wrap iframe {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
    }
    .fallback {
        position: absolute;
        inset: 0;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 24px;
        text-align: center;
        background: var(--card);
    }
    .fallback .big { font-size: 44px; }
    .fallback p { font-size: 0.86rem; color: var(--text-light); line-height: 1.7; max-width: 360px; }
    .fallback .hintline { font-size: 0.78rem; }
    .fallback code {
        background: var(--item);
        border-radius: 4px;
        padding: 1px 5px;
        word-break: break-all;
    }

    /* ---------------- 移动端：列表铺满页宽 ---------------- */
    /* 移动端浏览器没有内置 PDF 插件，不做内嵌预览，只显示列表 */
    body.mode-mobile {
        grid-template-columns: minmax(0, 1fr);
        height: auto;
        min-height: 100vh;
        min-height: 100dvh;
        overflow: auto;
    }
    body.mode-mobile .viewer { display: none; }
    body.mode-mobile .sidebar {
        min-height: 100vh;
        min-height: 100dvh;
        border-right: 0;
    }
    body.mode-mobile .side-head { position: sticky; top: 0; z-index: 5; padding: 13px 14px; background: var(--card); }
    body.mode-mobile .side-head .title { font-size: 1.02rem; }
    body.mode-mobile .side-list { padding: 8px 10px; }
    body.mode-mobile .year-head { padding: 10px 6px 5px; }
    body.mode-mobile .item { padding: 11px 12px; font-size: 0.92rem; margin-bottom: 6px; }
    body.mode-mobile .open-hint { display: inline-block; }
    body.mode-mobile .side-note { padding: 12px 14px 18px; }

    @media (max-width: 768px) {
        body { grid-template-columns: minmax(0, 1fr); }
        body.mode-mobile { grid-template-columns: minmax(0, 1fr); }
    }
</style>
</head>
<body>

<aside class="sidebar" id="sidebar">
    <div class="side-head">
        <span class="title">检验科排班表</span>
    </div>
    <nav class="side-list" id="sideList" aria-label="排班表列表"></nav>
    <div class="side-note">
        <a href="../index.html">← 返回星元检验工具箱</a>
    </div>
</aside>

<main class="viewer">
    <div class="v-bar">
        <a class="btn primary" id="openBtn" href="#" target="_blank" rel="noopener">在新窗口打开</a>
        <span class="v-title" id="vTitle">检验科排班表</span>
        <div class="v-actions">
            <a class="btn" id="downloadBtn" href="#" download>下载</a>
        </div>
    </div>
    <div class="frame-wrap">
        <iframe id="pdfFrame" title="排班表 PDF 预览"></iframe>
        <div class="fallback" id="fallback">
            <div class="big">📄</div>
            <p id="fallbackText">这个 PDF 暂时无法在页面内预览，请点击下方按钮打开。</p>
            <a class="btn primary" id="fallbackBtn" href="#" target="_blank" rel="noopener">新窗口打开 PDF</a>
        </div>
    </div>
</main>

<script>
(function () {
    'use strict';

    var MANIFEST_URL = 'data/schedule.json';
    var STORAGE_KEY = 'jyk-schedule-last';
    var ITEM_ICON = { month: '📄', holiday: '🎉' };

    var sideList = document.getElementById('sideList');
    var vTitle = document.getElementById('vTitle');
    var openBtn = document.getElementById('openBtn');
    var downloadBtn = document.getElementById('downloadBtn');
    var frame = document.getElementById('pdfFrame');
    var fallback = document.getElementById('fallback');
    var fallbackText = document.getElementById('fallbackText');
    var fallbackBtn = document.getElementById('fallbackBtn');

    var entries = [];     // 全部选项（含不可用），按清单顺序（已按日期排序）
    var usable = [];      // 可用选项的下标
    var current = -1;

    // 移动端（Android Chrome 等）没有内置 PDF 插件，页面内嵌 iframe 看不到内容，
    // 因此移动端只用列表，点击条目在新窗口/系统阅读器中打开。
    function detectMobile() {
        var ua = navigator.userAgent || '';
        var uaMobile = /Android|iPhone|iPad|iPod|Windows Phone|HarmonyOS|Mobile|Silk/i.test(ua);
        var coarse = false;
        try {
            coarse = window.matchMedia && window.matchMedia('(hover: none) and (pointer: coarse)').matches;
        } catch (e) { /* 老浏览器忽略 */ }
        // 窄屏但支持鼠标（桌面窗口缩小）仍按桌面处理
        return uaMobile || (coarse && Math.min(window.innerWidth, window.innerHeight) < 620);
    }

    var isMobile = detectMobile();
    if (isMobile) document.body.classList.add('mode-mobile');

    /* ---------------- 工具 ---------------- */

    function encodePath(p) {
        return p.split('/').map(encodeURIComponent).join('/');
    }

    function readStored() {
        try { return localStorage.getItem(STORAGE_KEY); } catch (e) { return null; }
    }

    function writeStored(id) {
        try { localStorage.setItem(STORAGE_KEY, id); } catch (e) { /* 隐私模式等，忽略 */ }
    }

    function fileName(p) {
        return p.split('/').pop();
    }

    /* ---------------- 侧边栏渲染 ---------------- */

    function stateBox(html) {
        sideList.innerHTML = '';
        var box = document.createElement('div');
        box.className = 'state';
        box.innerHTML = html;
        sideList.appendChild(box);
        return box;
    }

    function buildSidebar(manifest) {
        sideList.innerHTML = '';
        var frag = document.createDocumentFragment();

        (manifest.years || []).forEach(function (yearInfo) {
            var head = document.createElement('div');
            head.className = 'year-head';
            head.textContent = yearInfo.year + ' 年';
            frag.appendChild(head);

            (yearInfo.entries || []).forEach(function (entry) {
                var index = entries.length;
                entries.push(entry);
                if (entry.available) usable.push(index);

                // 移动端用 div + <a>（整条就是「在新窗口打开」链接）；桌面端用 button 做选中
                var node = document.createElement(isMobile && entry.available ? 'div' : 'button');
                node.className = 'item' + (entry.available ? '' : ' missing');
                node.dataset.index = String(index);
                node.title = entry.available ? (yearInfo.year + '年' + entry.label) : (entry.label + '：暂无排班表文件');

                var icon = document.createElement('span');
                icon.className = 'ico';
                icon.textContent = ITEM_ICON[entry.kind] || '📄';

                function labelSpan(cls, text) {
                    var span = document.createElement('span');
                    span.className = cls;
                    span.textContent = text;
                    return span;
                }

                if (!entry.available) {
                    // 灰显：不可点
                    node.type = 'button';
                    node.disabled = true;
                    node.appendChild(icon);
                    node.appendChild(labelSpan('txt', entry.label));
                    node.appendChild(labelSpan('none', '暂无'));
                } else if (isMobile) {
                    // 整条 = 在新窗口打开该 PDF 的链接
                    var link = document.createElement('a');
                    link.className = 'txt';
                    link.target = '_blank';
                    link.rel = 'noopener';
                    link.href = encodePath(entry.file);
                    link.appendChild(icon);
                    link.appendChild(labelSpan('label', entry.label));
                    link.addEventListener('click', function () { markActive(index); });
                    node.appendChild(link);
                    node.appendChild(labelSpan('open-hint', '打开 ↗'));
                } else {
                    // 桌面端：点击切换到内嵌预览
                    node.type = 'button';
                    node.appendChild(icon);
                    node.appendChild(labelSpan('txt', entry.label));
                    node.addEventListener('click', function () { select(index, true); });
                }
                frag.appendChild(node);
            });
        });

        sideList.appendChild(frag);
    }

    /* ---------------- 选中（桌面：内嵌预览；移动端：只记高亮） ---------------- */

    function markActive(index) {
        var nodes = sideList.querySelectorAll('.item');
        for (var i = 0; i < nodes.length; i++) {
            var on = Number(nodes[i].dataset.index) === index;
            nodes[i].classList.toggle('active', on);
            nodes[i].setAttribute('aria-current', on ? 'true' : 'false');
            if (on) nodes[i].scrollIntoView({ block: 'nearest' });
        }
    }

    function select(index, updateHash) {
        if (index < 0 || index >= entries.length) return;
        var entry = entries[index];
        if (!entry.available) return;

        current = index;
        var url = encodePath(entry.file);
        markActive(index);

        var fullName = entry.id.slice(0, 4) + '年' + entry.label;
        vTitle.textContent = fullName;
        openBtn.href = url;
        downloadBtn.href = url;
        downloadBtn.setAttribute('download', fileName(entry.file));
        fallbackBtn.href = url;
        fallback.style.display = 'none';

        // 桌面端浏览器自带 PDF 插件，直接内嵌预览
        var target = url + '#view=FitH';
        if (frame.getAttribute('src') !== target) frame.setAttribute('src', target);

        writeStored(entry.id);
        if (updateHash) {
            var hash = '#' + entry.id;
            if (location.hash !== hash) {
                try { history.replaceState(null, '', hash); } catch (e) { location.hash = entry.id; }
            }
        }
        document.title = fullName + '排班表 - 星元检验工具箱';
    }

    function step(delta) {
        if (!usable.length) return;
        var pos = usable.indexOf(current);
        if (pos < 0) { select(usable[0], true); return; }
        var next = pos + delta;
        if (next < 0 || next >= usable.length) return;
        select(usable[next], true);
    }

    function findByHash() {
        var id = decodeURIComponent((location.hash || '').replace(/^#/, ''));
        if (!id) return -1;
        for (var i = 0; i < entries.length; i++) {
            if (entries[i].available && entries[i].id === id) return i;
        }
        return -1;
    }

    function pickInitial() {
        var byHash = findByHash();
        if (byHash >= 0) return byHash;

        var stored = readStored();
        if (stored) {
            for (var i = 0; i < entries.length; i++) {
                if (entries[i].available && entries[i].id === stored) return i;
            }
        }

        // 默认：当年当月 → 当年最近一项 → 清单中最后一个可用项（即最新）
        var now = new Date();
        var ym = now.getFullYear() + '-' + ('0' + (now.getMonth() + 1)).slice(-2);
        var best = -1, bestKey = null;
        var targetKey = now.getFullYear() * 100 + (now.getMonth() + 1);
        for (var j = 0; j < entries.length; j++) {
            var e = entries[j];
            if (!e.available) continue;
            if (e.id === ym) return j;
            if (e.kind !== 'month') continue;
            var key = Number(e.id.slice(0, 4)) * 100 + e.month;
            if (key <= targetKey && (bestKey === null || key > bestKey)) { bestKey = key; best = j; }
        }
        if (best >= 0) return best;
        return usable.length ? usable[usable.length - 1] : -1;
    }

    /* ---------------- 键盘 ---------------- */

    document.addEventListener('keydown', function (e) {
        var tag = e.target && e.target.tagName;
        if (tag && /^(INPUT|TEXTAREA|SELECT)$/.test(tag)) return;
        if (isMobile) return;
        if (e.key === 'ArrowLeft') { e.preventDefault(); step(-1); }
        else if (e.key === 'ArrowRight') { e.preventDefault(); step(1); }
    });

    window.addEventListener('hashchange', function () {
        var i = findByHash();
        if (i >= 0 && i !== current) select(i, false);
    });

    /* ---------------- 加载清单 ---------------- */

    function applyManifest(manifest) {
        entries = [];
        usable = [];
        buildSidebar(manifest);

        if (!usable.length) {
            current = -1;
            vTitle.textContent = '暂无排班表';
            openBtn.removeAttribute('href');
            downloadBtn.removeAttribute('href');
            fallbackBtn.removeAttribute('href');
            fallbackText.textContent = '清单里还没有可用的排班表 PDF。';
            fallback.style.display = 'flex';
            return;
        }

        var start = pickInitial();
        select(start >= 0 ? start : usable[0], true);
    }

    function showLoadError(err) {
        var detail = (err && err.message) ? err.message : '未知错误';
        var box = stateBox('<b>清单加载失败</b>' +
            '没读到 <code>' + MANIFEST_URL + '</code>：' + detail + '<br>' +
            '请先运行 <code>python generate_schedule_manifest.py</code> 生成清单；' +
            '若以本地文件方式打开（file://），请改用 <code>python -m http.server</code> 后通过 http:// 访问。' +
            '<br><button class="retry" type="button">重试</button>');
        box.querySelector('.retry').addEventListener('click', load);
        vTitle.textContent = '排班表清单未加载';
        fallbackText.textContent = '排班表清单加载失败，请先生成 data/schedule.json，或通过 http:// 访问本页。';
        fallback.style.display = 'flex';
    }

    function load() {
        fetch(MANIFEST_URL, { cache: 'no-cache' })
            .then(function (res) {
                if (!res.ok) throw new Error('HTTP ' + res.status);
                return res.json();
            })
            .then(applyManifest)
            .catch(showLoadError);
    }

    /* ---------------- 启动 ---------------- */

    load();
})();
</script>
</body>
</html>
