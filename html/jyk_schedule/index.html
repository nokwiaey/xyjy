<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>检验科排班表 - 星元检验工具箱</title>
<meta name="description" content="榆林市星元医院临床检验中心排班表在线查看与下载，含各月份及节假日排班。">
<meta property="og:title" content="检验科排班表" />
<meta property="og:description" content="榆林市星元医院临床检验中心排班表在线查看与下载" />
<meta property="og:type" content="website" />
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
        --brand: #159895;
        --brand-dark: #1a5f7a;
        --bg: #f1f5f7;
        --card: #ffffff;
        --text: #1f3b45;
        --text-light: #6b8089;
        --border: #e2e9ec;
        --item: #eef4f6;
        --item-hover: #e0edf0;
        --shadow: 0 6px 18px rgba(21, 95, 122, 0.10);
        --sidebar-w: 216px;
    }

    @media (prefers-color-scheme: dark) {
        :root {
            --bg: #0f1a1f;
            --card: #16262c;
            --text: #e6eef1;
            --text-light: #93a8b0;
            --border: #24363d;
            --item: #1d323a;
            --item-hover: #264049;
            --shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
        }
    }

    html, body { height: 100%; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        display: grid;
        grid-template-columns: var(--sidebar-w) minmax(0, 1fr);
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
    }

    /* ---------------- 左侧竖排导航 ---------------- */
    .sidebar {
        display: flex;
        flex-direction: column;
        min-height: 0;
        background: var(--card);
        border-right: 1px solid var(--border);
    }

    .side-head {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 12px 10px;
        border-bottom: 1px solid var(--border);
    }
    .side-head .title {
        font-size: 0.92rem;
        font-weight: 700;
        color: var(--brand-dark);
        letter-spacing: 0.5px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    @media (prefers-color-scheme: dark) {
        .side-head .title { color: #7fd6d2; }
    }

    /* 顶栏上的「排班表」按钮：仅移动端显示，桌面端列表常驻 */
    .nav-toggle { display: none; }

    .side-list {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 8px;
        scrollbar-width: thin;
    }
    .side-list::-webkit-scrollbar { width: 7px; }
    .side-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .year-head {
        font-size: 0.72rem;
        font-weight: 600;
        letter-spacing: 1px;
        color: var(--text-light);
        padding: 10px 8px 6px;
    }

    .item {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        margin-bottom: 4px;
        border: 1px solid transparent;
        border-radius: 9px;
        background: var(--item);
        color: var(--text);
        font-family: inherit;
        font-size: 0.86rem;
        text-align: left;
        cursor: pointer;
        transition: background 0.15s, color 0.15s;
    }
    .item:hover:not(.missing) { background: var(--item-hover); }
    .item.active {
        background: linear-gradient(135deg, var(--brand-dark), var(--brand));
        color: #fff;
        box-shadow: 0 3px 10px rgba(21, 152, 149, 0.30);
    }
    .item.missing {
        opacity: 0.42;
        cursor: not-allowed;
        background: transparent;
        border-color: var(--border);
        border-style: dashed;
    }
    .item .ico { font-size: 0.9rem; flex: 0 0 auto; }
    .item .txt { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item .none { font-size: 0.7rem; color: var(--text-light); flex: 0 0 auto; }
    .item.active .none { color: rgba(255, 255, 255, 0.75); }

    .side-note {
        padding: 9px 12px;
        border-top: 1px solid var(--border);
        font-size: 0.72rem;
        color: var(--text-light);
        line-height: 1.5;
    }
    .side-note a { color: var(--brand); text-decoration: none; }
    .side-note a:hover { text-decoration: underline; }

    .state {
        margin: 6px;
        padding: 14px 12px;
        border: 1px dashed var(--border);
        border-radius: 10px;
        font-size: 0.8rem;
        color: var(--text-light);
        line-height: 1.7;
    }
    .state b { color: var(--text); display: block; margin-bottom: 4px; }
    .state code {
        display: inline-block;
        background: var(--item);
        border-radius: 4px;
        padding: 1px 5px;
        font-size: 0.74rem;
        word-break: break-all;
    }
    .state .retry {
        margin-top: 8px;
        border: 1px solid var(--border);
        background: var(--item);
        color: var(--text);
        border-radius: 8px;
        padding: 5px 12px;
        font-size: 0.78rem;
        font-family: inherit;
        cursor: pointer;
    }

    /* ---------------- 右侧预览 ---------------- */
    .viewer {
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
        background: var(--card);
    }

    .v-bar {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 14px;
        border-bottom: 1px solid var(--border);
        flex: 0 0 auto;
    }
    .v-title {
        flex: 1;
        min-width: 0;
        font-size: 0.9rem;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .v-actions { display: flex; gap: 8px; flex: 0 0 auto; }
    .btn {
        display: inline-flex;
        align-items: center;
        border: 1px solid var(--border);
        background: var(--item);
        color: var(--text);
        border-radius: 8px;
        padding: 6px 11px;
        font-size: 0.78rem;
        text-decoration: none;
        cursor: pointer;
        white-space: nowrap;
        transition: background 0.15s;
    }
    .btn:hover { background: var(--item-hover); }
    .btn.primary {
        background: linear-gradient(135deg, var(--brand-dark), var(--brand));
        color: #fff;
        border-color: transparent;
    }

    .frame-wrap {
        flex: 1;
        min-height: 0;
        position: relative;
        background: #525659;
    }
    .frame-wrap iframe {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
    }
    .fallback {
        position: absolute;
        inset: 0;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 24px;
        text-align: center;
        background: var(--card);
    }
    .fallback .big { font-size: 44px; }
    .fallback p { font-size: 0.86rem; color: var(--text-light); line-height: 1.7; max-width: 360px; }
    .fallback .hintline { font-size: 0.78rem; }
    .fallback code {
        background: var(--item);
        border-radius: 4px;
        padding: 1px 5px;
        word-break: break-all;
    }

    /* ---------------- 抽屉（移动端） ---------------- */
    .scrim { display: none; }
    .side-close { display: none; }

    @media (max-width: 768px) {
        body {
            display: flex;
            flex-direction: column;
            height: auto;
            min-height: 100vh;
            min-height: 100dvh;
            overflow: auto;
        }
        .sidebar {
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            width: min(80vw, 280px);
            z-index: 30;
            display: flex;
            flex-direction: column;
            transform: translateX(-104%);
            transition: transform 0.22s ease;
            box-shadow: var(--shadow);
            will-change: transform;
        }
        body.nav-open .sidebar { transform: translateX(0); }
        body.nav-open .scrim {
            display: block;
            position: fixed;
            inset: 0;
            z-index: 20;
            background: rgba(0, 0, 0, 0.42);
        }
        .side-head { padding: 10px 10px 9px; }
        .side-head .title { font-size: 0.98rem; }
        .side-close {
            display: block;
            flex: 0 0 auto;
            border: 1px solid var(--border);
            background: var(--item);
            color: var(--text-light);
            border-radius: 8px;
            width: 28px;
            height: 28px;
            font-size: 13px;
            line-height: 1;
            font-family: inherit;
            cursor: pointer;
        }

        /* 预览区顶栏：左上角的「排班表」按钮 = 打开竖排列表 */
        .viewer { flex: 1 1 auto; min-height: 74vh; min-height: 74dvh; }
        .v-bar { padding: 8px 12px; gap: 8px; }
        .nav-toggle {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            flex: 0 0 auto;
            max-width: 48vw;
            border: 1px solid var(--border);
            background: var(--item);
            color: var(--text);
            border-radius: 9px;
            padding: 7px 10px;
            font-family: inherit;
            font-size: 0.8rem;
            cursor: pointer;
        }
        .nav-toggle[aria-expanded="true"] { background: var(--item-hover); }
        .nav-toggle .cur {
            max-width: 30vw;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: var(--brand);
            font-weight: 600;
        }
        .v-title { font-size: 0.84rem; }
        .v-actions .btn { padding: 6px 9px; font-size: 0.74rem; }
    }
</style>
</head>
<body>

<aside class="sidebar" id="sidebar">
    <div class="side-head">
        <span class="title">检验科排班表</span>
        <button class="side-close" id="sideClose" type="button" aria-label="收起排班表列表">✕</button>
    </div>
    <nav class="side-list" id="sideList" aria-label="排班表列表"></nav>
    <div class="side-note">
        <a href="../index.html">← 返回星元检验工具箱</a>
    </div>
</aside>

<div class="scrim" id="scrim"></div>

<main class="viewer">
    <div class="v-bar">
        <button class="nav-toggle" id="navToggle" type="button" aria-controls="sidebar" aria-expanded="false">
            <span>☰ 排班表</span>
            <span class="cur" id="curName"></span>
        </button>
        <span class="v-title" id="vTitle">检验科排班表</span>
        <div class="v-actions">
            <a class="btn primary" id="openBtn" href="#" target="_blank" rel="noopener">新窗口打开</a>
            <a class="btn" id="downloadBtn" href="#" download>下载</a>
        </div>
    </div>
    <div class="frame-wrap">
        <iframe id="pdfFrame" title="排班表 PDF 预览"></iframe>
        <div class="fallback" id="fallback">
            <div class="big">📄</div>
            <p id="fallbackText">当前环境无法内嵌预览 PDF，请点击下方按钮在新窗口打开。</p>
            <a class="btn primary" id="fallbackBtn" href="#" target="_blank" rel="noopener">新窗口打开 PDF</a>
            <p class="hintline">或在本目录下运行 <code>python -m http.server</code> 后通过 http:// 访问本页</p>
        </div>
    </div>
</main>

<script>
(function () {
    'use strict';

    var MANIFEST_URL = 'data/schedule.json';
    var STORAGE_KEY = 'jyk-schedule-last';
    var ITEM_ICON = { month: '📄', holiday: '🎉' };

    var sideList = document.getElementById('sideList');
    var navToggle = document.getElementById('navToggle');
    var sideClose = document.getElementById('sideClose');
    var scrim = document.getElementById('scrim');
    var curName = document.getElementById('curName');
    var vTitle = document.getElementById('vTitle');
    var frame = document.getElementById('pdfFrame');
    var fallback = document.getElementById('fallback');
    var fallbackText = document.getElementById('fallbackText');
    var openBtn = document.getElementById('openBtn');
    var downloadBtn = document.getElementById('downloadBtn');
    var fallbackBtn = document.getElementById('fallbackBtn');

    var entries = [];     // 全部选项（含不可用），按清单顺序（已按日期排序）
    var usable = [];      // 可用选项的下标
    var current = -1;
    var isFileProtocol = location.protocol === 'file:';

    /* ---------------- 工具 ---------------- */

    function encodePath(p) {
        return p.split('/').map(encodeURIComponent).join('/');
    }

    function readStored() {
        try { return localStorage.getItem(STORAGE_KEY); } catch (e) { return null; }
    }

    function writeStored(id) {
        try { localStorage.setItem(STORAGE_KEY, id); } catch (e) { /* 隐私模式等，忽略 */ }
    }

    function fileName(p) {
        return p.split('/').pop();
    }

    /* ---------------- 侧边栏渲染 ---------------- */

    function stateBox(html) {
        sideList.innerHTML = '';
        var box = document.createElement('div');
        box.className = 'state';
        box.innerHTML = html;
        sideList.appendChild(box);
        return box;
    }

    function buildSidebar(manifest) {
        sideList.innerHTML = '';
        var frag = document.createDocumentFragment();

        (manifest.years || []).forEach(function (yearInfo) {
            var head = document.createElement('div');
            head.className = 'year-head';
            head.textContent = yearInfo.year + ' 年';
            frag.appendChild(head);

            (yearInfo.entries || []).forEach(function (entry) {
                var index = entries.length;
                entries.push(entry);
                if (entry.available) usable.push(index);

                var btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'item' + (entry.available ? '' : ' missing');
                btn.dataset.index = String(index);
                if (!entry.available) {
                    btn.disabled = true;
                    btn.title = entry.label + '：暂无排班表文件';
                } else {
                    btn.title = yearInfo.year + '年' + entry.label;
                }
                btn.innerHTML = '<span class="ico">' + (ITEM_ICON[entry.kind] || '📄') + '</span>' +
                    '<span class="txt"></span>' +
                    (entry.available ? '' : '<span class="none">暂无</span>');
                btn.querySelector('.txt').textContent = entry.label;

                if (entry.available) {
                    btn.addEventListener('click', function () { select(index, true); });
                }
                frag.appendChild(btn);
            });
        });

        sideList.appendChild(frag);
    }

    /* ---------------- 选中与预览 ---------------- */

    function select(index, updateHash) {
        if (index < 0 || index >= entries.length) return;
        var entry = entries[index];
        if (!entry.available) return;

        current = index;
        var url = encodePath(entry.file);

        var nodes = sideList.querySelectorAll('.item');
        for (var i = 0; i < nodes.length; i++) {
            var on = Number(nodes[i].dataset.index) === index;
            nodes[i].classList.toggle('active', on);
            nodes[i].setAttribute('aria-current', on ? 'true' : 'false');
            if (on) {
                nodes[i].scrollIntoView({ block: 'nearest' });
                if (window.innerWidth <= 768) closeNav();
            }
        }

        var fullName = entry.id.slice(0, 4) + '年' + entry.label;
        vTitle.textContent = fullName;
        curName.textContent = entry.label;
        openBtn.href = url;
        downloadBtn.href = url;
        downloadBtn.setAttribute('download', fileName(entry.file));
        fallbackBtn.href = url;
        fallback.style.display = 'none';

        var target = url + '#view=FitH';
        if (frame.getAttribute('src') !== target) frame.setAttribute('src', target);

        writeStored(entry.id);
        if (updateHash) {
            var hash = '#' + entry.id;
            if (location.hash !== hash) {
                try { history.replaceState(null, '', hash); } catch (e) { location.hash = entry.id; }
            }
        }
        document.title = fullName + '排班表 - 星元检验工具箱';
    }

    function step(delta) {
        if (!usable.length) return;
        var pos = usable.indexOf(current);
        if (pos < 0) { select(usable[0], true); return; }
        var next = pos + delta;
        if (next < 0 || next >= usable.length) return;
        select(usable[next], true);
    }

    function findByHash() {
        var id = decodeURIComponent((location.hash || '').replace(/^#/, ''));
        if (!id) return -1;
        for (var i = 0; i < entries.length; i++) {
            if (entries[i].available && entries[i].id === id) return i;
        }
        return -1;
    }

    function pickInitial() {
        var byHash = findByHash();
        if (byHash >= 0) return byHash;

        var stored = readStored();
        if (stored) {
            for (var i = 0; i < entries.length; i++) {
                if (entries[i].available && entries[i].id === stored) return i;
            }
        }

        // 默认：当年当月 → 当年最近一项 → 清单中最后一个可用项（即最新）
        var now = new Date();
        var ym = now.getFullYear() + '-' + ('0' + (now.getMonth() + 1)).slice(-2);
        var best = -1, bestKey = null;
        var targetKey = now.getFullYear() * 100 + (now.getMonth() + 1);
        for (var j = 0; j < entries.length; j++) {
            var e = entries[j];
            if (!e.available) continue;
            if (e.id === ym) return j;
            if (e.kind !== 'month') continue;
            var key = Number(e.id.slice(0, 4)) * 100 + e.month;
            if (key <= targetKey && (bestKey === null || key > bestKey)) { bestKey = key; best = j; }
        }
        if (best >= 0) return best;
        return usable.length ? usable[usable.length - 1] : -1;
    }

    /* ---------------- 抽屉 ---------------- */

    function openNav() {
        document.body.classList.add('nav-open');
        navToggle.setAttribute('aria-expanded', 'true');
        var active = sideList.querySelector('.item.active');
        if (active) active.scrollIntoView({ block: 'nearest' });
        try { sideClose.focus({ preventScroll: true }); } catch (e) { /* 忽略 */ }
    }

    function closeNav() {
        var wasOpen = document.body.classList.contains('nav-open');
        document.body.classList.remove('nav-open');
        navToggle.setAttribute('aria-expanded', 'false');
        if (wasOpen) {
            try { navToggle.focus({ preventScroll: true }); } catch (e) { /* 忽略 */ }
        }
    }

    navToggle.addEventListener('click', function () {
        if (document.body.classList.contains('nav-open')) closeNav(); else openNav();
    });
    sideClose.addEventListener('click', closeNav);
    scrim.addEventListener('click', closeNav);

    /* ---------------- 键盘 ---------------- */

    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') { closeNav(); return; }
        var tag = e.target && e.target.tagName;
        if (tag && /^(INPUT|TEXTAREA|SELECT)$/.test(tag)) return;
        if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); step(-1); }
        else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); step(1); }
    });

    window.addEventListener('hashchange', function () {
        var i = findByHash();
        if (i >= 0 && i !== current) select(i, false);
    });

    /* ---------------- 加载清单 ---------------- */

    function applyManifest(manifest) {
        entries = [];
        usable = [];
        buildSidebar(manifest);

        if (!usable.length) {
            current = -1;
            vTitle.textContent = '暂无排班表';
            frame.removeAttribute('src');
            openBtn.removeAttribute('href');
            downloadBtn.removeAttribute('href');
            fallbackBtn.removeAttribute('href');
            fallbackText.textContent = '清单里还没有可用的排班表 PDF。';
            fallback.style.display = 'flex';
            return;
        }

        var start = pickInitial();
        select(start >= 0 ? start : usable[0], true);
        if (isFileProtocol) showFileHint();
    }

    function showFileHint() {
        fallbackText.innerHTML = '当前以本地文件方式打开，浏览器通常不允许内嵌预览 PDF。' +
            '请点击下方按钮在新窗口打开，或在本目录下运行 <code>python -m http.server</code> 后通过 http:// 访问。';
        fallback.style.display = 'flex';
    }

    function showLoadError(err) {
        var box = stateBox('<b>清单加载失败</b>' +
            '没读到 <code>' + MANIFEST_URL + '</code>，详情：' + (err && err.message ? err.message : '未知错误') + '<br>' +
            '请先运行 <code>python generate_schedule_manifest.py</code> 生成清单。' +
            '<br><button class="retry" type="button">重试</button>');
        box.querySelector('.retry').addEventListener('click', load);
        vTitle.textContent = '排班表清单未加载';
        fallbackText.textContent = '排班表清单加载失败，请先生成 data/schedule.json。';
        fallback.style.display = 'flex';
    }

    function load() {
        fetch(MANIFEST_URL, { cache: 'no-cache' })
            .then(function (res) {
                if (!res.ok) throw new Error('HTTP ' + res.status);
                return res.json();
            })
            .then(applyManifest)
            .catch(showLoadError);
    }

    load();
})();
</script>
</body>
</html>
