    :root {
        --brand: #159895;

            --card: #16262c;
            --text: #e6eef1;
            --text-light: #93a8b0;

        border-right: 1px solid var(--border);
    }

    .side-head {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 12px 10px;
        border-bottom: 1px solid var(--border);
    }
    .side-head .title {
        font-size: 0.92rem;
        font-weight: 700;
        color: var(--brand-dark);
        letter-spacing: 0.5px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    @media (prefers-color-scheme: dark) {
        .side-head .title { color: #7fd6d2; }
    }

    /* 顶栏上的「排班表」按钮：仅移动端显示，桌面端列表常驻 */

    .side-list {

    .year-head {

    /* ---------------- 抽屉（移动端） ---------------- */
    .scrim { display: none; }
    .side-close { display: none; }

    @media (max-width: 768px) {
        body {
            display: flex;

        body.nav-open .sidebar { transform: translateX(0); }
        body.nav-open .scrim {

        .side-head { padding: 10px 10px 9px; }
        .side-head .title { font-size: 0.98rem; }
        .side-close {

        /* 预览区顶栏：左上角的「排班表」按钮 = 打开竖排列表 */

</style>

<script type="module">
/* ---------------- PDF 渲染（PDF.js，Android Chrome 等无内置 PDF 插件的浏览器也能看） ---------------- */
var PDFJS_BASE = 'vendor/pdfjs/';
var pdfjsLib = null;
var pdfjsReady = null;
var pdfDoc = null;
var pdfUrl = '';
var pageNum = 1;
var scale = 1;
var autoFit = true;
var renderToken = 0;
var pdfToken = 0;

var canvas = document.getElementById('pdfCanvas');
var viewportEl = document.getElementById('pdfViewport');
var statusEl = document.getElementById('pdfStatus');
var vTools = document.getElementById('vTools');
var prevPageBtn = document.getElementById('prevPageBtn');
var nextPageBtn = document.getElementById('nextPageBtn');
var zoomInBtn = document.getElementById('zoomInBtn');
var zoomOutBtn = document.getElementById('zoomOutBtn');
var fitBtn = document.getElementById('fitBtn');
var pageInfo = document.getElementById('pageInfo');
var zoomInfo = document.getElementById('zoomInfo');

function loadPdfJs() {
    if (!pdfjsReady) {
        pdfjsReady = import(PDFJS_BASE + 'pdf.min.mjs').then(function (mod) {
            pdfjsLib = mod;
            mod.GlobalWorkerOptions.workerSrc = PDFJS_BASE + 'pdf.worker.min.mjs';
            return mod;
        });
    }
    return pdfjsReady;
}

function setStatus(text) {
    if (text) {
        statusEl.textContent = text;
        statusEl.hidden = false;
    } else {
        statusEl.hidden = true;
    }
}

function updateToolbar() {
    var total = pdfDoc ? pdfDoc.numPages : 0;
    pageInfo.textContent = total ? (pageNum + ' / ' + total) : '– / –';
    zoomInfo.textContent = Math.round(scale * 100) + '%';
    prevPageBtn.disabled = !pdfDoc || pageNum <= 1;
    nextPageBtn.disabled = !pdfDoc || pageNum >= total;
    zoomInBtn.disabled = !pdfDoc || scale >= 4;
    zoomOutBtn.disabled = !pdfDoc || scale <= 0.4;
    fitBtn.disabled = !pdfDoc;
    vTools.hidden = !pdfDoc;
}

function fitScale(page, viewport) {
    var padding = 20;
    var avail = viewportEl.clientWidth - padding;
    if (avail <= 60) avail = 320;
    var base = page.getViewport({ scale: 1 });
    return Math.min(4, Math.max(0.15, avail / base.width));
}

function renderCurrentPage() {
    if (!pdfDoc) return;
    var token = ++renderToken;

    pdfDoc.getPage(pageNum).then(function (page) {
        if (token !== renderToken) return;
        if (autoFit) scale = fitScale(page, null);

        var viewport = page.getViewport({ scale: scale });
        var dpr = Math.min(window.devicePixelRatio || 1, 2);
        var maxDim = 4096;
        dpr = Math.max(0.5, Math.min(dpr, maxDim / viewport.width, maxDim / viewport.height));

        canvas.width = Math.floor(viewport.width * dpr);
        canvas.height = Math.floor(viewport.height * dpr);
        canvas.style.width = Math.floor(viewport.width) + 'px';
        canvas.style.height = Math.floor(viewport.height) + 'px';

        var task = page.render({
            canvasContext: canvas.getContext('2d'),
            viewport: viewport,
            transform: dpr !== 1 ? [dpr, 0, 0, dpr, 0, 0] : null
        });

        return task.promise.then(function () {
            if (token !== renderToken) return;
            setStatus('');
            updateToolbar();
        });
    }).catch(function (err) {
        if (token !== renderToken) return;
        if (err && err.name === 'RenderingCancelledException') return;
        showViewerError(err);
    });
}

function openDocument(url, entry) {
    var token = ++pdfToken;
    pageNum = 1;
    autoFit = true;
    scale = 1;

    if (pdfDoc && pdfUrl === url) {
        renderCurrentPage();
        return;
    }

    if (pdfDoc) {
        try { pdfDoc.destroy(); } catch (e) { /* 忽略 */ }
        pdfDoc = null;
    }
    pdfUrl = url;
    updateToolbar();
    setStatus('正在加载 PDF…');

    loadPdfJs().then(function (mod) {
        return mod.getDocument({ url: url });
    }).then(function (doc) {
        if (token !== pdfToken) {
            try { doc.destroy(); } catch (e) { /* 忽略 */ }
            return;
        }
        pdfDoc = doc;
        updateToolbar();
        renderCurrentPage();
    }).catch(function (err) {
        if (token !== pdfToken) return;
        showViewerError(err);
    });
}

function showViewerError(err) {
    pdfDoc = null;
    updateToolbar();
    setStatus('');
    document.dispatchEvent(new CustomEvent('schedule:openFailed', { detail: err }));
}

function goToPage(n) {
    if (!pdfDoc) return;
    n = Math.min(Math.max(1, n), pdfDoc.numPages);
    if (n === pageNum) return;
    pageNum = n;
    updateToolbar();
    renderCurrentPage();
    viewportEl.scrollTop = 0;
}

function setScale(next, fit) {
    autoFit = !!fit;
    scale = Math.min(4, Math.max(0.4, next));
    renderCurrentPage();
}

prevPageBtn.addEventListener('click', function () { goToPage(pageNum - 1); });
nextPageBtn.addEventListener('click', function () { goToPage(pageNum + 1); });
zoomInBtn.addEventListener('click', function () { setScale(scale * 1.25, false); });
zoomOutBtn.addEventListener('click', function () { setScale(scale / 1.25, false); });
fitBtn.addEventListener('click', function () { setScale(1, true); });

var resizeTimer = null;
window.addEventListener('resize', function () {
    if (resizeTimer) clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
        if (pdfDoc) renderCurrentPage();
    }, 160);
});

/* 选中排班表时打开对应 PDF；懒渲染，页面上没有选中任何 PDF 时不会加载查看器 */
var pendingOpen = null;
var viewerReady = false;
document.addEventListener('schedule:open', function (e) {
    if (!viewerReady) { pendingOpen = e.detail.url; return; }
    openDocument(e.detail.url);
});
viewerReady = true;
if (pendingOpen) {
    var first = pendingOpen;
    pendingOpen = null;
    openDocument(first);
}
</script>

<script>
(function () {
    'use strict';

    var MANIFEST_URL = 'data/schedule.json';
    var STORAGE_KEY = 'jyk-schedule-last';
    var ITEM_ICON = { month: '📄', holiday: '🎉' };

    var sideList = document.getElementById('sideList');
    var navToggle = document.getElementById('navToggle');
    var sideClose = document.getElementById('sideClose');
    var scrim = document.getElementById('scrim');
    var curName = document.getElementById('curName');
    var vTitle = document.getElementById('vTitle');
    var openBtn = document.getElementById('openBtn');
    var downloadBtn = document.getElementById('downloadBtn');
    var fallback = document.getElementById('fallback');
    var fallbackText = document.getElementById('fallbackText');
    var fallbackBtn = document.getElementById('fallbackBtn');

    var entries = [];     // 全部选项（含不可用），按清单顺序（已按日期排序）
    var usable = [];      // 可用选项的下标
    var current = -1;

    /* ---------------- 工具 ---------------- */

    function encodePath(p) {
        return p.split('/').map(encodeURIComponent).join('/');
    }

    function readStored() {
        try { return localStorage.getItem(STORAGE_KEY); } catch (e) { return null; }
    }

    function writeStored(id) {
        try { localStorage.setItem(STORAGE_KEY, id); } catch (e) { /* 隐私模式等，忽略 */ }
    }

    function fileName(p) {
        return p.split('/').pop();
    }

    /* ---------------- 侧边栏渲染 ---------------- */

    function stateBox(html) {
        sideList.innerHTML = '';
        var box = document.createElement('div');
        box.className = 'state';
        box.innerHTML = html;
        sideList.appendChild(box);
        return box;
    }

    function buildSidebar(manifest) {
        sideList.innerHTML = '';
        var frag = document.createDocumentFragment();

        (manifest.years || []).forEach(function (yearInfo) {
            var head = document.createElement('div');
            head.className = 'year-head';
            head.textContent = yearInfo.year + ' 年';
            frag.appendChild(head);

            (yearInfo.entries || []).forEach(function (entry) {
                var index = entries.length;
                entries.push(entry);
                if (entry.available) usable.push(index);

                var btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'item' + (entry.available ? '' : ' missing');
                btn.dataset.index = String(index);
                if (!entry.available) {
                    btn.disabled = true;
                    btn.title = entry.label + '：暂无排班表文件';
                } else {
                    btn.title = yearInfo.year + '年' + entry.label;
                }
                btn.innerHTML = '<span class="ico">' + (ITEM_ICON[entry.kind] || '📄') + '</span>' +
                    '<span class="txt"></span>' +
                    (entry.available ? '' : '<span class="none">暂无</span>');
                btn.querySelector('.txt').textContent = entry.label;

                if (entry.available) {
                    btn.addEventListener('click', function () { select(index, true); });
                }
                frag.appendChild(btn);
            });
        });

        sideList.appendChild(frag);
    }

    /* ---------------- 选中与预览 ---------------- */

    function select(index, updateHash) {
        if (index < 0 || index >= entries.length) return;
        var entry = entries[index];
        if (!entry.available) return;

        current = index;
        var url = encodePath(entry.file);

        var nodes = sideList.querySelectorAll('.item');
        for (var i = 0; i < nodes.length; i++) {
            var on = Number(nodes[i].dataset.index) === index;
            nodes[i].classList.toggle('active', on);
            nodes[i].setAttribute('aria-current', on ? 'true' : 'false');
            if (on) {
                nodes[i].scrollIntoView({ block: 'nearest' });
                if (window.innerWidth <= 768) closeNav();
            }
        }

        var fullName = entry.id.slice(0, 4) + '年' + entry.label;
        vTitle.textContent = fullName;
        curName.textContent = entry.label;
        openBtn.href = url;
        downloadBtn.href = url;
        downloadBtn.setAttribute('download', fileName(entry.file));
        fallbackBtn.href = url;
        fallback.style.display = 'none';

        // 交给 PDF.js 查看器渲染（移动端 Chrome 没有内置 PDF 插件，iframe 看不到内容）
        document.dispatchEvent(new CustomEvent('schedule:open', { detail: { url: url } }));

        writeStored(entry.id);
        if (updateHash) {
            var hash = '#' + entry.id;
            if (location.hash !== hash) {
                try { history.replaceState(null, '', hash); } catch (e) { location.hash = entry.id; }
            }
        }
        document.title = fullName + '排班表 - 星元检验工具箱';
    }

    function step(delta) {
        if (!usable.length) return;
        var pos = usable.indexOf(current);
        if (pos < 0) { select(usable[0], true); return; }
        var next = pos + delta;
        if (next < 0 || next >= usable.length) return;
        select(usable[next], true);
    }

    function findByHash() {
        var id = decodeURIComponent((location.hash || '').replace(/^#/, ''));
        if (!id) return -1;
        for (var i = 0; i < entries.length; i++) {
            if (entries[i].available && entries[i].id === id) return i;
        }
        return -1;
    }

    function pickInitial() {
        var byHash = findByHash();
        if (byHash >= 0) return byHash;

        var stored = readStored();
        if (stored) {
            for (var i = 0; i < entries.length; i++) {
                if (entries[i].available && entries[i].id === stored) return i;
            }
        }

        // 默认：当年当月 → 当年最近一项 → 清单中最后一个可用项（即最新）
        var now = new Date();
        var ym = now.getFullYear() + '-' + ('0' + (now.getMonth() + 1)).slice(-2);
        var best = -1, bestKey = null;
        var targetKey = now.getFullYear() * 100 + (now.getMonth() + 1);
        for (var j = 0; j < entries.length; j++) {
            var e = entries[j];
            if (!e.available) continue;
            if (e.id === ym) return j;
            if (e.kind !== 'month') continue;
            var key = Number(e.id.slice(0, 4)) * 100 + e.month;
            if (key <= targetKey && (bestKey === null || key > bestKey)) { bestKey = key; best = j; }
        }
        if (best >= 0) return best;
        return usable.length ? usable[usable.length - 1] : -1;
    }

    /* ---------------- 抽屉 ---------------- */

    function openNav() {
        document.body.classList.add('nav-open');
        navToggle.setAttribute('aria-expanded', 'true');
        var active = sideList.querySelector('.item.active');
        if (active) active.scrollIntoView({ block: 'nearest' });
        try { sideClose.focus({ preventScroll: true }); } catch (e) { /* 忽略 */ }
    }

    function closeNav() {
        var wasOpen = document.body.classList.contains('nav-open');
        document.body.classList.remove('nav-open');
        navToggle.setAttribute('aria-expanded', 'false');
        if (wasOpen) {
            try { navToggle.focus({ preventScroll: true }); } catch (e) { /* 忽略 */ }
        }
    }

    navToggle.addEventListener('click', function () {
        if (document.body.classList.contains('nav-open')) closeNav(); else openNav();
    });
    sideClose.addEventListener('click', closeNav);
    scrim.addEventListener('click', closeNav);

    /* ---------------- 键盘 ---------------- */

    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') { closeNav(); return; }
        var tag = e.target && e.target.tagName;
        if (tag && /^(INPUT|TEXTAREA|SELECT)$/.test(tag)) return;
        if (e.key === 'ArrowLeft') { e.preventDefault(); step(-1); }
        else if (e.key === 'ArrowRight') { e.preventDefault(); step(1); }
    });

    window.addEventListener('hashchange', function () {
        var i = findByHash();
        if (i >= 0 && i !== current) select(i, false);
    });

    /* ---------------- 加载清单 ---------------- */

    function applyManifest(manifest) {
        entries = [];
        usable = [];
        buildSidebar(manifest);

        if (!usable.length) {
            current = -1;
            vTitle.textContent = '暂无排班表';
            openBtn.removeAttribute('href');
            downloadBtn.removeAttribute('href');
            fallbackBtn.removeAttribute('href');
            fallbackText.textContent = '清单里还没有可用的排班表 PDF。';
            fallback.style.display = 'flex';
            return;
        }

        var start = pickInitial();
        select(start >= 0 ? start : usable[0], true);
    }

    function showLoadError(err) {
        var detail = (err && err.message) ? err.message : '未知错误';
        var box = stateBox('<b>清单加载失败</b>' +
            '没读到 <code>' + MANIFEST_URL + '</code>：' + detail + '<br>' +
            '请先运行 <code>python generate_schedule_manifest.py</code> 生成清单；' +
            '若以本地文件方式打开（file://），请改用 <code>python -m http.server</code> 后通过 http:// 访问。' +
            '<br><button class="retry" type="button">重试</button>');
        box.querySelector('.retry').addEventListener('click', load);
        vTitle.textContent = '排班表清单未加载';
        fallbackText.textContent = '排班表清单加载失败，请先生成 data/schedule.json，或通过 http:// 访问本页。';
        fallback.style.display = 'flex';
    }

    function load() {
        fetch(MANIFEST_URL, { cache: 'no-cache' })
            .then(function (res) {
                if (!res.ok) throw new Error('HTTP ' + res.status);
                return res.json();
            })
            .then(applyManifest)
            .catch(showLoadError);
    }

    /* ---------------- PDF 渲染失败时降级 ---------------- */

    window.__scheduleViewerFailed = function (err) {
        if (current < 0) return;
        var name = entries[current] ? entries[current].label : '排班表';
        fallbackText.textContent = '「' + name + '」无法在页面内渲染' +
            (err && err.message ? '（' + err.message + '）' : '') + '，请点击下方按钮打开或下载。';
        fallback.style.display = 'flex';
    };

    document.addEventListener('schedule:openFailed', function (e) {
        window.__scheduleViewerFailed(e.detail);
    });

    load();
})();
</script>
</body>
</html>
